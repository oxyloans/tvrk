<svg xmlns="http://www.w3.org/2000/svg"
     width="8192" height="8192" viewBox="0 0 8192 8192"
     role="img" aria-labelledby="title desc">
  <title id="title">tvradhakrishna.com Square Icon</title>
  <desc id="desc">A clean square vector monogram icon based on the tvradhakrishna.com wordmark, using a bold lowercase t and v with the brand double underline.</desc>

  <!-- Transparent background -->

  <!-- Monogram group -->
  <g fill="#0B5B9A">
    <!-- lowercase t -->
    <path d="M1760 1650
             H2630
             V2470
             H3300
             V3180
             H2630
             V5050
             C2630 5325 2780 5465 3070 5465
             H3300
             V6200
             H2925
             C2190 6200 1760 5835 1760 5100
             V3180
             H1280
             V2470
             H1760
             Z"/>

    <!-- stylized lowercase v -->
    <path d="M3500 2470
             H4410
             L5040 5160
             L5670 2470
             H6580
             L5490 6200
             H4590
             Z"/>
  </g>

  <!-- Double underline motif -->
  <rect x="1260" y="6530" width="5400" height="95" rx="47.5" fill="#0B5B9A"/>
  <rect x="1260" y="6745" width="5400" height="58" rx="29" fill="#0B5B9A"/>

  <!-- Small brand dot accent -->
  <circle cx="6690" cy="6568" r="66" fill="#0B5B9A"/>
</svg>
